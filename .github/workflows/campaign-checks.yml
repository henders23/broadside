name: Broadside campaign checks
on:
  push:
    branches: [main]
  pull_request:

# Keep one expensive WebGL test matrix per branch when changes arrive in quick succession.
concurrency:
  group: broadside-campaign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-code-and-fleet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser scripts and character art
        run: node tests/syntax-smoke.test.js
      - name: Verify every officer and commander has a distinct photographic portrait
        run: node tests/portrait-coverage.mjs
      - name: Run fleet objective regression cases
        run: node tests/fleet-controller.test.js
      - name: Run mission environment lifecycle tests
        run: node tests/environment.test.js
      - name: Run flagship upgrade rules
        run: node tests/upgrades.test.js
      - name: Run officer experience rules
        run: node tests/experience.test.js
      - name: Run campaign data rules
        run: node tests/campaign-data.test.js
      - name: Run campaign depth rules (slots, difficulty, reputation, captures, recruits, codex)
        run: node tests/depth.test.js
      - name: Run war and story rules (fronts, push back, consequences)
        run: node tests/war.test.js
      - name: Run ship table tests (shared hulls, shipyard view, bosses)
        run: node tests/ships.test.js
      - name: Run tutorial steps
        run: node tests/tutorial.test.js
      - name: Run campaign drama rules (rivals, lane events, casualties, honours)
        run: node tests/drama.test.js

  browser-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and three.js
        run: npm install --no-save --no-package-lock playwright@1.63.0 three@0.169.0 && npx playwright install --with-deps chromium
      - name: Run the browser suites (headless Chromium, software WebGL)
        run: node tests/browser/run.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/browser/out
