#briefstrip{position:absolute;top:783px;left:250px;width:1120px;z-index:8;display:flex;gap:10px;height:142px}.mission-card{width:214px;flex:none;text-align:left;color:#dfe9f1;padding:4px 7px 9px;position:relative;overflow:hidden;border:1px solid #657f8f;background:#07121b;box-shadow:0 12px 20px #000b}.mission-card:hover,.mission-card:focus-visible,.mission-card.active{border-color:#ffc176;box-shadow:0 0 18px #eca44b77}.mission-card .photo{display:block;height:69px;background-image:linear-gradient(0deg,#05101b55,transparent),url('img/campaign-atlas.webp');background-size:1672px 941px;background-repeat:no-repeat;margin:-4px -7px 7px;filter:saturate(1.2)}.mission-card .n{position:absolute;top:5px;left:7px;border:1px solid #edb970;background:#08121ce5;width:26px;height:26px;text-align:center;line-height:24px;border-radius:50%;color:#f8c786;font-weight:750}.mission-card strong{font-size:11.5px;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.mission-card small{font-size:10px;color:#a4c4d7;display:block;margin-top:4px}.mission-card .status{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#d6ae76;margin-top:5px;display:block}.mission-card.locked{filter:saturate(.5);opacity:.78}

<script>

const Personnel=window.BroadsidePersonnel;
const KEY='broadside-campaign-v1';
const MISSIONS=[
 {id:1,system:'kestrel',name:'Distress at Kestrel',enemy:'scrapjaw',captain:'Captain Kora Vex',kind:'Pirate ram',objective:'Break the pirate attack and secure Kestrel’s trade lane.',brief:'Merchant traffic is scattering across the frontier. Captain Kora Vex is attacking transports near the agricultural platforms. Intercept her Scrapjaw-class raider before she escapes.',intel:'Heavy armour and scatterguns. She will try to ram your ship. Keep your distance and expose her weak shield facings.',reward:420,choice:['Recover civilian survivors','Pursue the escaping pirate network'],flags:['kestrel_rescue','kestrel_pursuit']},
 {id:2,system:'cinder',name:'The Cinder Wake',enemy:'revenant',captain:'Commander Orren Sable',kind:'Renegade minelayer',objective:'Identify the attacker and recover a navy transponder.',brief:'A wreck in the Cinder Wake carries a military transponder belonging to the Meridian Navy. Before the inspection is complete, an Ash Fleet minelayer emerges from the debris.',intel:'Long-range missile salvos and proximity mines deployed astern. Avoid chasing directly behind the ship.',reward:540,choice:['Rescue the surviving crew','Recover the intact coded transponder'],flags:['vela_rescue','vela_transponder']},
 {id:3,system:'rednarrows',name:"The Widow's Toll",enemy:'scrapjaw',captain:'Captain Garrick Thorne',kind:'Pirate commander',objective:'Reopen the Red Narrows trade route.',brief:'An illegal toll operation is strangling the jump route. Captain Garrick Thorne offers a bargain: leave the corridor or take his scrap-armoured cruiser head-on. His crew may surrender if their hull is severely damaged.',intel:'A Scrapjaw rammer. Force Thorne below 28% hull integrity to compel surrender, or destroy the raider.',reward:570,choice:['Offer amnesty for intelligence','Impound all captured pirate matériel'],flags:['thorne_amnesty','thorne_impounded']},
 {id:4,system:'halcyon',name:'Ghost Frequency',enemy:'seraph',captain:'ORACLE-9',kind:'Autonomous warship',objective:'Disable ORACLE-9 and recover the anomalous signal archive.',brief:'A deserted relay broadcasts coordinates with impossible precision. A machine warship called ORACLE-9 guards the transmission. Disable it and download the surviving data core.',intel:'The Seraph fights at long range with tracking beams and a devastating railgun. Close distance while controlling your shield facings.',reward:700,choice:['Transmit the archive to Fleet Command','Seal the archive pending investigation'],flags:['oracle_transmitted','oracle_sealed']},
 {id:5,system:'harrow',name:'The First Bloom',enemy:'wraith',captain:'The Cantor',kind:'Alien bioship',objective:'Survive contact for 100 seconds and transmit your sensor archive, or defeat the bioship.',brief:'The colonial guard at Harrow has vanished. A vessel that appears to be alive enters sensor range. Stay intact long enough for the automatic hundred-second sensor transmission to complete.',intel:'Its plasma eats shields. Spore salvos track your course. Its hull regenerates, so the safest objective is survival, not destruction.',reward:900,choice:['Warn every frontier colony immediately','Classify the encounter while the navy prepares'],flags:['harrow_warning','harrow_classified']}
];
// All coordinates are registered against the original 1672 × 941 campaign-atlas artwork.
const SYSTEMS=[
 ['aurelian','Aurelian',517,136,'Meridian Core','Navy','Low','Homeworld relay and secure defensive anchor.'],
 ['meridian','Meridian',532,237,'Meridian Core','Navy','Low','Regional command hub; repairs and requisition are available here.'],
 ['solace','Solace',402,259,'Meridian Core','Navy','Low','Hospitality and medical logistics serving the frontier.'],
 ['tarn','Tarn',478,305,'Meridian Core','Navy','Low','Mining and propulsion parts depot.'],
 ['innerpost','Innerpost',605,287,'Meridian Core','Navy','Low','Fleet listening station with navigational forecasts.'],
 ['northpoint','Northpoint',843,134,'Kestrel Verge','Contested','Moderate','Northern approach to Kestrel Verge.'],
 ['kestrel','Kestrel',830,205,'Kestrel Verge','Contested','High','Kestrel’s civilian transports are under attack; immediate naval intervention requested.'],
 ['vela','Vela',943,221,'Kestrel Verge','Contested','High','A drifting wreck emits a coded Meridian Navy transponder.'],
 ['driftwall','Driftwall',864,274,'Kestrel Verge','Contested','Moderate','Salvage fields shelter merchants and opportunistic raiders.'],
 ['peregrine','Peregrine',997,309,'Kestrel Verge','Independent','Moderate','Refuelling and commerce along the eastern spur.'],
 ['sable','Sable',1063,261,'Kestrel Verge','Independent','Moderate','Outpost between contested space and pirate territory.'],
 ['razor','Razor',1265,138,'Red Narrows','Pirates','High','A concealed staging ground for fast raiders.'],
 ['rednarrows','Red Narrows',1218,225,'Red Narrows','Pirates','Severe','Pirates levy illegal tolls on a crucial jump-lane bottleneck.'],
 ['scour','Scour',1195,291,'Red Narrows','Pirates','High','Scarred metal moons and a hidden market for stolen ship systems.'],
 ['bastion','Bastion',1340,260,'Red Narrows','Pirates','High','Old fortifications adapted as a pirate supply station.'],
 ['blackrift','Blackrift',1313,327,'Red Narrows','Pirates','Severe','Uncharted debris belt sheltering heavily armed corsair vessels.'],
 ['emberfall','Emberfall',435,454,'Ash Marches','Renegades','High','Refugee system under disputed military protection.'],
 ['kharon','Kharon',585,443,'Ash Marches','Renegades','High','An ominous naval signal has recently appeared here.'],
 ['cinder','Cinder Wake',508,523,'Ash Marches','Renegades','High','The Ash Fleet conceals warship activity in a turbulent debris field.'],
 ['vostok','Vostok',420,582,'Ash Marches','Renegades','High','An industrial outpost controlled by dissident officers.'],
 ['grimhold','Grimhold',599,583,'Ash Marches','Renegades','High','A fortified naval dockyard beyond Meridian jurisdiction.'],
 ['thalos','Thalos',801,345,'Halcyon Belt','Independent','Low','Sparsely inhabited observation system in the Halcyon Belt.'],
 ['elysia','Elysia',714,442,'Halcyon Belt','Independent','Low','Neutral research colony.'],
 ['halcyon','Halcyon',862,461,'Halcyon Belt','Machines','Severe','An abandoned relay broadcasts a repeating navigation signal.'],
 ['citrine','Citrine',771,507,'Halcyon Belt','Independent','Moderate','A supply port at the boundary of unknown machine activity.'],
 ['juniper','Juniper',994,475,'Halcyon Belt','Independent','Moderate','The great ringed planet makes this a busy transit hub.'],
 ['midway','Midway',900,554,'Halcyon Belt','Independent','Moderate','Trade transfers between independent colonies.'],
 ['nex','Nex',1164,459,'Harrow Expanse','Unknown','Severe','Strange organic signatures on outbound probes.'],
 ['widow','Widow’s Toll',1288,522,'Harrow Expanse','Unknown','Severe','A formerly quiet corridor now awash in alien biological signals.'],
 ['harrow','Harrow',1423,461,'Harrow Expanse','Aliens','Extreme','Frontier colony whose entire defence force has disappeared.'],
 ['mire','Mire',1470,522,'Harrow Expanse','Aliens','Extreme','Organic debris and electromagnetic interference impede mapping.'],
 ['bloom','Bloom',1163,575,'Harrow Expanse','Aliens','High','Regenerating matter now coats the wreckage of an old outpost.'],
 ['verdant','Verdant',1385,599,'Harrow Expanse','Aliens','Extreme','A green world from which no probe has returned.']
].map(([id,name,x,y,region,faction,threat,description])=>({id,name,x,y,region,faction,threat,description}));
const byId=Object.fromEntries(SYSTEMS.map(s=>[s.id,s]));
const ROUTES=[
 ['solace','tarn'],['solace','meridian'],['tarn','meridian'],['meridian','aurelian'],['meridian','innerpost'],['meridian','kestrel'],['aurelian','northpoint'],['innerpost','kestrel'],
 ['northpoint','kestrel'],['northpoint','vela'],['kestrel','vela'],['kestrel','driftwall'],['vela','driftwall'],['vela','sable'],['vela','peregrine'],['driftwall','peregrine'],['sable','peregrine'],
 ['sable','scour'],['sable','rednarrows'],['razor','rednarrows'],['rednarrows','scour'],['rednarrows','bastion'],['bastion','blackrift'],['scour','blackrift'],
 ['tarn','emberfall'],['emberfall','kharon'],['emberfall','cinder'],['emberfall','vostok'],['kharon','cinder'],['cinder','vostok'],['cinder','grimhold'],['kharon','elysia'],
 ['driftwall','thalos'],['thalos','elysia'],['thalos','halcyon'],['elysia','halcyon'],['elysia','citrine'],['halcyon','citrine'],['halcyon','juniper'],['halcyon','midway'],['citrine','midway'],['juniper','midway'],['peregrine','juniper'],
 ['juniper','nex'],['nex','widow'],['nex','bloom'],['widow','harrow'],['widow','mire'],['widow','bloom'],['harrow','mire'],['harrow','verdant'],['mire','verdant'],['bloom','verdant']
];
const $=id=>document.getElementById(id);
const shipChoices=['bastion','halberd','sabre','warden'];
const TORPEDO_CAP={bastion:8,halberd:6,sabre:6,warden:16};
const CREW=Personnel.crew;
function crewById(id){return CREW.find(c=>c.id===id)||CREW[0]}
function commanderByMission(n){return Personnel.commanders[n]}
function renderBridgeRail(){const el=$('crewmini');if(!el)return;el.replaceChildren();for(const c of CREW){const b=document.createElement('button');b.type='button';b.title=c.name+' — '+c.ability;b.style.cssText='background:none;border:0;padding:0';b.innerHTML=Personnel.portrait(c);b.addEventListener('click',()=>officerRoster(c.id));el.append(b)}}
function initial(){let pick='bastion';try{const v=JSON.parse(localStorage.getItem('broadside')||'{}');if(shipChoices.includes(v.ship))pick=v.ship;}catch(e){}return {version:1,ship:pick,shipName:'MNS Resolute',system:'meridian',completed:[],flags:{},credits:850,hull:1,sub:null,torps:null,attempts:0,pendingResult:null};}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.version===1&&shipChoices.includes(v.ship)&&Array.isArray(v.completed))return v;}catch(e){}return initial();}
let state=load(),selected='kestrel',currentRoute=[];
function persist(){localStorage.setItem(KEY,JSON.stringify(state));}
function isUnlocked(n){return n>=1&&n<=MISSIONS.length&&(n===1||state.completed.includes(n-1));}
function missionFor(system){return MISSIONS.find(m=>m.system===system);}
function displayName(s){return s?s.name:'Unknown';}
let toastTimer=0;function toast(t){$('notice').textContent=t;$('notice').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('notice').classList.remove('show'),3000);}
function frameSize(){const w=innerWidth,h=innerHeight;const s=Math.max(.61,Math.min(w/1672,h/941));$('holder').style.width=(1672*s)+'px';$('holder').style.height=(941*s)+'px';$('map').style.transform=`scale(${s})`;$('viewport').style.display=w>=1672*s?'flex':'block';$('viewport').style.alignItems='center';$('viewport').style.justifyContent='center';}
function neighbors(id){return ROUTES.flatMap(([a,b])=>a===id?[b]:b===id?[a]:[])}
function getPath(from,to){const q=[from],prev={[from]:null};for(let i=0;i<q.length;i++){const node=q[i];if(node===to)break;for(const next of neighbors(node)){if(!(next in prev)){prev[next]=node;q.push(next)}}}if(!(to in prev))return [];let path=[];for(let s=to;s!==null;s=prev[s])path.unshift(s);return path;}
function paintRoute(){const g=$('route-layers');g.replaceChildren();if(currentRoute.length<2)return;const el=document.createElementNS('http://www.w3.org/2000/svg','path');el.setAttribute('d',currentRoute.map((id,i)=>`${i?'L':'M'} ${byId[id].x} ${byId[id].y}`).join(' '));el.setAttribute('class','anim');g.append(el);}
function renderNodes(){const dest=$('nodes');dest.replaceChildren();for(const s of SYSTEMS){const b=document.createElement('button');b.type='button';b.className='node';b.dataset.id=s.id;b.style.left=s.x+'px';b.style.top=s.y+'px';b.setAttribute('aria-label',`Inspect ${s.name}, ${s.region}`);b.innerHTML='<span class="r"></span><span class="tooltip"></span>';b.querySelector('.tooltip').textContent=s.name;b.addEventListener('click',()=>selectSystem(s.id));dest.append(b)}}
function selectSystem(id){const s=byId[id];if(!s)return;selected=id;for(const b of document.querySelectorAll('.node'))b.classList.toggle('selected',b.dataset.id===id);$('sidetitle').textContent=s.name;$('sideregion').textContent=s.region;$('sysfaction').textContent=s.faction;$('systhreat').textContent=s.threat.toUpperCase();$('sysvalue').textContent=missionFor(id)?'CRITICAL':'REGIONAL';$('description').textContent=s.description;const focused=missionFor(id);const sx=focused ? 31 : Math.min(1672-300,Math.max(0,s.x-150)),sy=focused ? 221 : Math.min(941-136,Math.max(0,s.y-69));$('sysimage').style.backgroundPosition=`-${sx}px -${sy}px`;const m=missionFor(id);const n=m?.id||0;let status=m?(state.completed.includes(n)?'OPERATION COMPLETE':isUnlocked(n)?'DEPLOYMENT AUTHORISED':'INTEL LOCKED'):'UNASSIGNED SYSTEM';$('systemintel').textContent=m?`${m.captain} • ${m.kind}. ${status}. ${m.intel}`:`Jump network: ${neighbors(id).map(v=>byId[v].name).join(' · ')}.`;$('course').textContent=m&&isUnlocked(n)&&!state.completed.includes(n)?'OPEN MISSION BRIEFING ›':'PLOT NAVIGATION ROUTE ›';$('routeinfo').textContent=`Location: ${s.name}  /  ${neighbors(id).length} linked systems`;for(const b of document.querySelectorAll('.mission-card'))b.classList.toggle('active',Number(b.dataset.mission)===n);currentRoute=[];paintRoute();}
function renderMissions(){const dest=$('briefstrip');dest.replaceChildren();for(const m of MISSIONS){const s=byId[m.system],b=document.createElement('button');b.type='button';b.className='mission-card'+(!isUnlocked(m.id)&&!state.completed.includes(m.id)?' locked':'');b.dataset.mission=m.id;const left=290+(m.id-1)*219,top=790;const completed=state.completed.includes(m.id);b.setAttribute('aria-label',m.name+' — '+(completed?'completed':isUnlocked(m.id)?'ready':'locked'));b.innerHTML=`<span class="photo"></span><span class="n">${m.id}</span><strong></strong><small></small><span class="status"></span>`;b.querySelector('strong').textContent=m.name.toUpperCase();b.querySelector('small').textContent=s.region.toUpperCase();b.querySelector('.status').textContent=completed?'✓ COMPLETED':isUnlocked(m.id)?'● READY FOR DEPLOYMENT':'◇ CLASSIFIED';b.querySelector('.photo').style.backgroundPosition=`-${left}px -${top}px`;b.addEventListener('click',()=>{selectSystem(m.system);plot();if(isUnlocked(m.id)&&!completed)briefing(m);else if(!isUnlocked(m.id))toast('Complete prior operations to unlock this mission.');else toast('Operation already completed.')});dest.append(b)}}
function updateFleet(){const pct=Math.round((state.hull??1)*100);$('fleetstatus').innerHTML=`<b>${state.shipName}</b>  /  ${state.ship.toUpperCase()} &nbsp; · &nbsp; HULL ${pct}% &nbsp; · &nbsp; REQUISITION ${state.credits.toLocaleString()} &nbsp; · &nbsp; ${state.completed.length}/5 OPERATIONS`;renderMissions()}
function plot(){currentRoute=getPath(state.system||'meridian',selected);paintRoute();$('routeinfo').textContent=currentRoute.length?`${currentRoute.length-1} jump${currentRoute.length===2?'':'s'} plotted: ${currentRoute.map(id=>byId[id].name).join(' → ')}`:'No established jump route.';}
function openModal(title,header,html,actions){$('modal').classList.remove('personnel');$('modaltitle').textContent=title;$('modalheader').textContent=header;$('modalbody').innerHTML=html;const d=$('modalactions');d.replaceChildren();for(const action of actions){const b=document.createElement('button');b.textContent=action.label;b.className=action.primary?'primary':'';b.disabled=!!action.disabled;b.addEventListener('click',action.run);d.append(b)}$('veil').hidden=false;}
function close(){ $('veil').hidden=true; }
function briefing(m){if(!isUnlocked(m.id)){toast('This operation has not yet been unlocked.');return;}if(state.completed.includes(m.id)){toast('This mission has already been completed.');return;}plot();openModal(m.name,'MERIDIAN NAVAL COMMAND / OPERATION '+String(m.id).padStart(2,'0'),`<div class="brief-lead">${Personnel.portrait(crewById(Personnel.leads[m.id]))}<div><small>${crewById(Personnel.leads[m.id]).name.toUpperCase()} · BRIDGE REPORT</small><p>“${Personnel.briefLines[m.id]}”</p></div></div><p>${m.brief}</p><p><b>Primary objective:</b> ${m.objective}</p><div class="commander-brief">${Personnel.portrait(commanderByMission(m.id))}<div><small>${commanderByMission(m.id).faction}</small><b>${m.captain}</b><blockquote>“${commanderByMission(m.id).line}”</blockquote><p>${m.kind} · ${m.intel}</p></div></div><p><b>Bridge commands:</b> During battle use 5–9 to activate individual officer abilities. Each command has a separate cooldown.</p><p><b>Flagship:</b> ${state.shipName} (${state.ship}) · Hull ${Math.round(state.hull*100)}% · Requisition ${state.credits}</p><p>Battle damage will carry into subsequent operations. Return to the shipyard if repairs are needed.</p>`,[
 {label:'Return to sector map',run:close},
 {label:'Launch operation',primary:true,run:()=>{state.pendingResult=null;state.attempts++;persist();location.href=`index.html?campaign=${m.id}`;}}
]);}
function shipyard(){const repairPoints=Math.ceil((1-state.hull)*100);const cost=repairPoints*6;const can=repairPoints>0&&state.credits>=cost;const torpFull=TORPEDO_CAP[state.ship]||8;const torpHave=state.torps==null?torpFull:Math.max(0,Math.min(torpFull,state.torps));const torpCost=(torpFull-torpHave)*25;openModal('Flagship shipyard','MERIDIAN FLEET / REFIT DIVISION',`<p><b>${state.shipName}</b> — ${state.ship.toUpperCase()}-class warship</p><p>Hull integrity: <b>${Math.round(state.hull*100)}%</b> / 100%<br>Available requisition: <b>${state.credits}</b></p><p>Complete hull overhaul: <b>${cost} requisition</b>. A dockside overhaul also restores damaged ship subsystems.</p><p>Operational torpedoes: <b>${torpHave} / ${torpFull}</b> · Replenishment cost: <b>${torpCost} requisition</b>.</p>${!can&&repairPoints>0?'<p>Insufficient resources for full repairs. Partial emergency repairs are available.</p>':''}`,[
 {label:'Return',run:close},
 {label:`Emergency repair (100)`,disabled:state.credits<100||state.hull>=1,run:()=>{state.credits-=100;state.hull=Math.min(1,state.hull+.15);persist();updateFleet();shipyard()}},
 {label:torpCost?`Resupply torpedoes · ${torpCost}`:'Torpedoes replenished',disabled:!torpCost||state.credits<torpCost,run:()=>{state.credits-=torpCost;state.torps=torpFull;persist();updateFleet();shipyard()}},
 {label:repairPoints?`Overhaul · ${cost}`:'Hull fully repaired',primary:true,disabled:!can,run:()=>{state.credits-=cost;state.hull=1;state.sub=null;persist();updateFleet();shipyard()}}
 ]);}
function officerRoster(focus){const roster=focus?[...CREW].sort((a,b)=>(a.id===focus?-1:0)-(b.id===focus?-1:0)):CREW;const sections=roster.map(c=>`<article class="personnel-card">${Personnel.portrait(c)}<div><h3>${c.name}</h3><small>${c.post}</small><p>${c.bio}</p><strong>[${c.key}] ${c.ability} · ${c.cooldown}s cooldown</strong><p>${c.effect}</p></div></article>`).join('');openModal('Officers of the Resolute','MERIDIAN FLEET / PERSONNEL DOSSIER',`<p>Five named officers serve aboard <b>${state.shipName}</b>. Their abilities activate during campaign engagements using keys 5–9 or the bridge-command buttons.</p><div class="personnel-grid">${sections}</div>`,[{label:'Return to campaign',run:close}]);$('modal').classList.add('personnel');}
function intelligence(){const done=state.completed;openModal('Campaign intelligence','SECTOR INTELLIGENCE / RESTRICTED',`<p><b>Meridian Core:</b> Navy territory remains secure, but frontier shipping has suffered unexplained losses.</p><p><b>Kestrel Verge:</b> ${done.includes(1)?'Pirate action disrupted. Captain Vex’s intelligence is being analysed.':'Distress calls report a fast pirate raider attacking merchant traffic.'}</p><p><b>Ash Marches:</b> ${done.includes(2)?'Evidence indicates that renegade human military hardware has been deployed.':'Renegade naval contacts remain unverified.'}</p><p><b>Halcyon Belt and Harrow Expanse:</b> Deep-space signals are classified pending additional missions.</p><p><b>Your decisions:</b> ${Object.keys(state.flags||{}).filter(k=>state.flags[k]).map(k=>k.replaceAll('_',' ')).join(' · ')||'No major campaign decisions recorded.'}</p>`,[{label:'Close intelligence',run:close}]);}
function newCampaign(){openModal('Commission a flagship','NEW CAMPAIGN / THE LONG WATCH',`<p>The Meridian frontier has been quiet for fourteen years. Three merchant ships have vanished in six days. Navy command calls it piracy. The last transmission from Kestrel was not a distress call. It was a warning.</p><p>Choose the hull of <b>MNS Resolute</b>. This resets existing campaign progress.</p><label for="pickShip">FLAGSHIP CLASS</label><select id="pickShip"><option value="bastion">Bastion · Heavy battleship</option><option value="halberd">Halberd · Lance cruiser</option><option value="sabre">Sabre · Battlecruiser</option><option value="warden">Warden · Siege dreadnought</option></select>`,[
 {label:'Cancel',run:close},
 {label:'Begin new campaign',primary:true,run:()=>{let ship=$('pickShip').value;state=initial();state.ship=ship;persist();close();updateFleet();selectSystem('kestrel');toast('Captain commissioned. Proceed to Distress at Kestrel.');}}
]);$('pickShip').value=state.ship;}
function afterAction(){const r=state.pendingResult;if(!r)return;const m=MISSIONS.find(x=>x.id===r.id);if(!m){state.pendingResult=null;persist();return;}if(r.outcome==='win'){
   const choices=(m.choice||['Report directly to command','Hold position and gather intelligence']).map((name,i)=>({label:name,run:()=>{if(m.flags)state.flags[m.flags[i]]=true;state.completed=[...new Set([...state.completed,m.id])].sort((a,b)=>a-b);state.credits+=m.reward;state.pendingResult=null;state.system=m.system;persist();close();updateFleet();selectSystem(m.system);toast('Mission complete. '+m.reward+' requisition awarded.')}}));
   openModal('Mission accomplished','AFTER-ACTION REPORT / '+m.name.toUpperCase(),`<p>${r.tacticalOutcome==='extracted'?'The alien Cantor remains in Harrow. The Resolute has transmitted invaluable biological sensor data and withdrawn before being destroyed.':r.tacticalOutcome==='surrender'?'<b>Captain Garrick Thorne has surrendered.</b> The pirate toll lanes are open; his remaining crew have been taken into custody.':`<b>${m.captain}</b> has been defeated. The ${m.kind.toLowerCase()} is no longer an immediate threat.`}</p><p><b>Remaining flagship hull:</b> ${Math.round(state.hull*100)}%.<br><b>Operation reward:</b> ${m.reward} requisition.<br><b>Operations completed:</b> ${state.completed.length+1}.</p><div class="brief-lead">${Personnel.portrait(CREW[0])}<div><small>COMMANDER VARRO / AFTER ACTION</small><p>"The crew are standing by for your orders. The next operation will not wait for us."</p></div></div><p>Choose how your captain handles the aftermath:</p>`,[{label:'Review map',run:close},...choices]);
 }else{
   openModal('Ship recovered','AFTER-ACTION REPORT / OPERATION FAILED',`<p>The ${state.shipName} has suffered catastrophic damage. Navy recovery teams returned the surviving crew to Meridian-controlled space.</p><p>Hull restored to ${Math.round(state.hull*100)}% by emergency repairs. The operation remains available to attempt again. <b>100 requisition</b> has been withheld for recovery services (where affordable).</p>`,[{label:'Return to map',primary:true,run:()=>{state.pendingResult=null;state.system='meridian';persist();close();updateFleet()}}]);
 }}
$('course').addEventListener('click',()=>{const m=missionFor(selected);if(m&&isUnlocked(m.id)&&!state.completed.includes(m.id)){briefing(m)}else{plot();toast('Jump course plotted. Select an active operation to deploy.')}});
$('tabShip').addEventListener('click',shipyard);$('tabCrew').addEventListener('click',officerRoster);$('tabIntel').addEventListener('click',intelligence);$('tabNew').addEventListener('click',newCampaign);$('tabDuel').addEventListener('click',()=>location.href='index.html');$('tabMap').addEventListener('click',()=>{close();selectSystem('kestrel')});$('veil').addEventListener('click',e=>{if(e.target===$('veil'))close()});window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});window.addEventListener('resize',frameSize);
renderNodes();renderBridgeRail();frameSize();selectSystem('kestrel');updateFleet();if(!localStorage.getItem(KEY))persist();if(state.pendingResult)afterAction();
</script>
</body>
</html>
